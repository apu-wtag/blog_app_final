version: '3.8'
x-app-base: &app-base
  build: .
  networks:
    - app_network
  volumes:
    - .:/rails
    - bundle_cache:/usr/local/bundle
  tty: true
  env_file: ./.env

networks:
  app_network:
    driver: bridge

services:
  db:
    image: postgres:14
    networks:
      - app_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    restart: always

  redis:
    image: redis:7-alpine
    networks:
      - app_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    restart: always

  web:
    <<: *app-base
    command: bash -c "bundle exec rails s -p 3000 -b '0.0.0.0'"
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST}:5432/${POSTGRES_DB_DEV}
      REDIS_URL: redis://${REDIS_HOST}:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    tty: true
  tailwind:
    <<: *app-base
    command: bin/rails tailwindcss:watch[poll]
    depends_on:
      - web

  sidekiq:
    <<: *app-base
    command: bundle exec sidekiq
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST}:5432/${POSTGRES_DB_DEV}
      REDIS_URL: redis://${REDIS_HOST}:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
  redis_data:
  bundle_cache: